name: control_api
description: >
  Universal Device Agent — Control API. Devices connect here (WebSocket,
  persistent), Dashboard/AI clients call this over REST + WebSocket.
  Isi ka Dart client shared_app/lib/protocol/api_client.dart mein hai —
  saare endpoint paths/shapes yahan se **exactly** match karte hain.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^1.0.4
  web_socket_channel: ^2.4.0
  uuid: ^4.3.0
  crypto: ^3.0.3
  http: ^1.2.0        # P0-07 — connector OAuth token-exchange + API calls (Google Drive, etc.)
  cryptography: ^2.0.0 # P0-07 — connector credential encryption-at-rest (AES-GCM-256); `crypto` package is hash-only, can't encrypt/decrypt

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0
